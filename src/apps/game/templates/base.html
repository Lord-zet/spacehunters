{% load static %}

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Space Hunters{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'scifi': ['Orbitron', 'sans-serif'],
                        'mono': ['Roboto Mono', 'monospace'],
                    },
                    colors: {
                        'space-blue': '#0a192f',
                        'accent-cyan': '#00f2ff',
                        'accent-orange': '#ff8c00',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(rgba(10, 25, 47, 0.5), rgba(10, 25, 47, 0.7)),
                        url('{% static "game/backgrounds/background_main.jfif" %}');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hud-border {
            position: relative;
        }

        .hud-border::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 10px; height: 10px;
            border-top: 2px solid #00f2ff; border-left: 2px solid #00f2ff;
        }

        .hud-border::after {
            content: "";
            position: absolute;
            bottom: 0; right: 0; width: 10px; height: 10px;
            border-bottom: 2px solid #00f2ff; border-right: 2px solid #00f2ff;
        }

        .nav-link-active {
            color: #00f2ff;
            background: rgba(255, 255, 255, 0.05);
            border-left: 2px solid #00f2ff;
        }

        .planet-select {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 242, 255, 0.3);
            color: #00f2ff;
            padding: 2px 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .planet-select:hover {
            border-color: #00f2ff;
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.2);
        }

        .planet-select option {
            background-color: #0a192f;
            color: white;
        }

        #settings-dropdown {
            display: none;
        }
        #settings-dropdown.active {
            display: block;
        }

        @keyframes toast-progress {
            from { width: 100%; }
            to { width: 0%; }
        }
        .animate-toast-progress {
            animation: toast-progress 5s linear forwards;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}font-sans min-h-screen flex flex-col{% endblock %}">
    {% block body_content %}{% endblock %}

    <script>
        function closeToast(toastElement) {
            if (toastElement) {
                toastElement.classList.add('translate-x-full', 'opacity-0');
                setTimeout(() => {
                    toastElement.remove();
                }, 300);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const btn = document.getElementById('settings-btn');
            const dropdown = document.getElementById('settings-dropdown');
            const container = document.getElementById('settings-menu-container');

            if (btn && dropdown && container) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    dropdown.classList.toggle('active');
                });

                document.addEventListener('click', function(event) {
                    if (!container.contains(event.target)) {
                        dropdown.classList.remove('active');
                    }
                });

                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') {
                        dropdown.classList.remove('active');
                    }
                });
            }

            const toasts = document.querySelectorAll('.alert-toast');
            toasts.forEach(function(toast) {
                setTimeout(function() {
                    closeToast(toast);
                }, 5000);
            });
        });
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
