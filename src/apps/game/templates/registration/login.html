{% extends "game/base.html" %}

{% block content %}
<div class="panel login-panel">

    <h2>Login</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.non_field_errors }}

        <div class="form-row">
            {{ form.username.label_tag }}
            {{ form.username }}
        </div>

        <div class="form-row">
            {{ form.password.label_tag }}
            {{ form.password }}
        </div>

        <button type="submit">Login</button>
    </form>

</div>
{% endblock %}
