{% extends "base.html" %}

{% block title %}Nie znaleziono strony{% endblock %}

{% block body_content %}
  <main class="min-h-screen flex items-center justify-center px-6 font-mono">
    <section class="glass-panel hud-border max-w-xl w-full p-8 text-center">
      <p class="text-[10px] text-accent-cyan uppercase tracking-[0.3em] mb-3">Sygnał utracony</p>
      <h1 class="font-scifi text-5xl text-white mb-4">404</h1>
      <p class="text-sm text-white/70 mb-2">Nie znaleźliśmy strony, której szukasz.</p>
      <p class="text-xs text-white/40 mb-6">Adres może być niepoprawny albo zasób został usunięty.</p>

      <a href="{% url 'root' %}"
         class="inline-flex items-center justify-center border border-accent-cyan/40 bg-accent-cyan/10 px-5 py-3 text-xs uppercase tracking-widest text-accent-cyan hover:bg-accent-cyan/20 transition-colors">
        Wróć na stronę główną
      </a>
    </section>
  </main>
{% endblock %}
